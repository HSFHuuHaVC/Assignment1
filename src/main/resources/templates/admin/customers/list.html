<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Khách hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h1 class="h3 mb-0">Khách hàng</h1>
        <a class="btn btn-primary" th:href="@{/admin/customers/new}">+ Thêm khách hàng</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/admin/customers}">
        <div class="col-md-10">
            <label for="customerKeyword" class="visually-hidden">Tìm khách hàng theo tên, email hoặc số điện thoại</label>
            <input id="customerKeyword" class="form-control" name="kw" th:value="${kw}" placeholder="Tên, email hoặc số điện thoại">
        </div>
        <div class="col-md-2 d-grid"><button class="btn btn-outline-primary" type="submit">Tìm</button></div>
    </form>
    <div class="table-responsive" role="region" aria-label="Danh sách khách hàng" tabindex="0">
        <table class="table table-hover align-middle">
            <thead class="table-light"><tr><th scope="col">Họ tên</th><th scope="col">Email</th><th scope="col">SĐT</th><th scope="col">Ngày sinh</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead>
            <tbody>
            <tr th:if="${customers.empty}"><td colspan="6" class="text-center text-muted">Không có dữ liệu</td></tr>
            <tr th:each="c : ${customers.content}">
                <td th:text="${c.fullName}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.mobile}"></td>
                <td class="text-nowrap" th:text="${#temporals.format(c.birthday, 'dd/MM/yyyy')}"></td>
                <td><span class="badge" th:classappend="${c.account.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'" th:text="${c.account.status}"></span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/customers/{id}/edit(id=${c.customerId})}">Sửa</a>
                    <form class="d-inline" method="post" th:action="@{/admin/customers/{id}/lock(id=${c.customerId})}">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:text="${c.account.status.name() == 'ACTIVE'} ? 'Khoá' : 'Mở khoá'"></button>
                    </form>
                    <form class="d-inline" method="post" th:action="@{/admin/customers/{id}/delete(id=${c.customerId})}"
                          onsubmit="return confirm('Xoá khách hàng này? Nếu đã có đơn đặt vé, tài khoản sẽ bị khoá.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Xoá</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/layout :: pagination(${customers}, ${pageUrl})}"></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
