<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 820px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3" th:text="|Đơn đặt vé #${booking.bookingId}|"></h1>
    <div class="table-responsive" role="region" aria-label="Chi tiết đơn" tabindex="0">
    <table class="table">
        <tr><th scope="row">Trạng thái</th><td class="text-break" th:text="${booking.status}"></td></tr>
        <tr><th scope="row">Ngày đặt</th><td class="text-break" th:text="${#temporals.format(booking.bookingDate, 'dd/MM/yyyy HH:mm')}"></td></tr>
        <tr><th scope="row">Khách hàng</th><td class="text-break" th:text="|${booking.customer.fullName} · ${booking.customer.email} · ${booking.customer.mobile}|"></td></tr>
        <tr><th scope="row">Phim</th><td class="text-break" th:text="${booking.showtime.movie.title}"></td></tr>
        <tr><th scope="row">Suất chiếu</th><td class="text-break" th:text="|${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy HH:mm')} · ${booking.showtime.room.roomName}|"></td></tr>
        <tr><th scope="row">Ghế</th><td><span class="badge bg-dark me-1" th:each="t : ${booking.tickets}" th:text="${t.seatCode}"></span></td></tr>
        <tr><th scope="row">Tổng tiền</th><td class="text-break fw-bold" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td></tr>
    </table>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-secondary" th:href="@{/admin/bookings}">Quay lại</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
