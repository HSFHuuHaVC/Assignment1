<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 480px">
    <h1 class="h3">Đổi mật khẩu</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form method="post" th:action="@{/customer/password}" th:object="${form}" novalidate>
        <div class="mb-3">
            <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword" autocomplete="current-password"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="newPassword">Mật khẩu mới</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <p class="small text-muted">Mật khẩu mới từ 8 ký tự, có chữ hoa, chữ thường và chữ số.</p>
        <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
        <a class="btn btn-secondary" th:href="@{/customer/profile}">Huỷ</a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
