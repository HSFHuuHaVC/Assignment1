<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Vé của tôi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3">Lịch sử đặt vé</h1>
    <form class="row g-2 mb-3" method="get" th:action="@{/customer/bookings}">
        <div class="col-md-4">
            <label for="bookingStatus" class="form-label">Trạng thái đơn</label>
            <select id="bookingStatus" class="form-select" name="status">
                <option value="">Tất cả trạng thái</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == status}"></option>
            </select>
        </div>
        <div class="col-md-2 d-grid align-self-end"><button class="btn btn-outline-primary" type="submit">Lọc</button></div>
    </form>
    <div class="table-responsive" role="region" aria-label="Lịch sử đặt vé" tabindex="0">
        <table class="table table-hover align-middle">
            <thead class="table-light"><tr><th scope="col">#</th><th scope="col">Ngày đặt</th><th scope="col">Phim</th><th scope="col">Suất chiếu</th><th scope="col">Tổng tiền</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead>
            <tbody>
            <tr th:if="${bookings.empty}"><td colspan="7" class="text-center text-muted">Bạn chưa có đơn đặt vé nào phù hợp</td></tr>
            <tr th:each="b : ${bookings.content}">
                <td th:text="${b.bookingId}"></td>
                <td class="text-nowrap" th:text="${#temporals.format(b.bookingDate, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${b.showtime.movie.title}"></td>
                <td th:text="|${#temporals.format(b.showtime.startTime, 'dd/MM/yyyy HH:mm')} · ${b.showtime.room.roomName}|"></td>
                <td class="text-nowrap" th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                <td th:text="${b.status}"></td>
                <td><a class="btn btn-sm btn-outline-primary text-nowrap" th:href="@{/customer/bookings/{id}(id=${b.bookingId})}">Chi tiết</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/layout :: pagination(${bookings}, ${pageUrl})}"></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
