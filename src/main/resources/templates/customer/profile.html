<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Hồ sơ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 720px">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1 class="h3 mb-0">Hồ sơ cá nhân</h1>
        <a class="btn btn-outline-secondary" th:href="@{/customer/password}">Đổi mật khẩu</a>
    </div>
    <div class="mt-3" th:replace="~{fragments/layout :: flash}"></div>
    <form method="post" th:action="@{/customer/profile}" th:object="${form}" novalidate class="row g-3 mt-1">
        <div class="col-12">
            <label class="form-label" for="username">Tên đăng nhập</label>
            <input id="username" class="form-control" th:value="*{username}" disabled>
            <div class="form-text">Tên đăng nhập được giữ nguyên khi đổi email liên hệ.</div>
        </div>
        <div class="col-12">
            <label class="form-label" for="fullName">Họ tên</label>
            <input type="text" class="form-control" th:field="*{fullName}" th:errorclass="is-invalid" maxlength="100" required>
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="email">Email liên hệ</label>
            <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid" maxlength="100" required>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="mobile">Số điện thoại</label>
            <input type="tel" class="form-control" th:field="*{mobile}" th:errorclass="is-invalid" maxlength="10" required>
            <div class="invalid-feedback" th:errors="*{mobile}"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="birthday">Ngày sinh</label>
            <input type="date" class="form-control" th:field="*{birthday}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:errors="*{birthday}"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="identityCard">CCCD</label>
            <input type="text" class="form-control" th:field="*{identityCard}" th:errorclass="is-invalid" maxlength="12" required>
            <div class="invalid-feedback" th:errors="*{identityCard}"></div>
        </div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Lưu thay đổi</button></div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
