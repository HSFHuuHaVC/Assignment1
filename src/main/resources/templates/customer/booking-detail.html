<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 820px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3" th:text="|Đơn đặt vé #${booking.bookingId}|"></h1>
    <div class="table-responsive" role="region" aria-label="Chi tiết đơn đặt vé" tabindex="0">
        <table class="table">
            <tr><th scope="row">Trạng thái</th><td th:text="${booking.status}"></td></tr>
            <tr><th scope="row">Ngày đặt</th><td th:text="${#temporals.format(booking.bookingDate, 'dd/MM/yyyy HH:mm')}"></td></tr>
            <tr><th scope="row">Phim</th><td class="text-break" th:text="${booking.showtime.movie.title}"></td></tr>
            <tr><th scope="row">Suất chiếu</th><td th:text="${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy HH:mm')}"></td></tr>
            <tr><th scope="row">Phòng</th><td th:text="${booking.showtime.room.roomName}"></td></tr>
            <tr><th scope="row">Ghế</th><td><span class="badge bg-dark me-1" th:each="t : ${booking.tickets}" th:text="${t.seatCode}"></span></td></tr>
            <tr><th scope="row">Tổng tiền</th><td class="fw-bold" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td></tr>
        </table>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <form th:if="${booking.status.name() != 'CANCELLED'}" method="post"
              th:action="@{/customer/bookings/{id}/cancel(id=${booking.bookingId})}"
              onsubmit="return confirm('Bạn chắc chắn muốn huỷ đơn này?');" class="d-inline">
            <button class="btn btn-outline-danger" type="submit">Huỷ đơn</button>
        </form>
        <a class="btn btn-primary" th:href="@{/customer/showtimes/{id}/seats(id=${booking.showtime.showtimeId})}">Chọn thêm ghế</a>
        <a class="btn btn-secondary" th:href="@{/customer/bookings}">Vé của tôi</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
